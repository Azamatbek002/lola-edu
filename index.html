<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C0272D" />
    <meta name="description" content="Lola Edu Türk Dili Markazi — o'quv markazi boshqaruv tizimi" />
    <meta name="application-name" content="Lola Edu" />
    <!-- iPhone: bosh ekrandan to'liq ekran ilova sifatida ochilishi -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lola Edu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lola Edu — Türk Dili Markazi</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Ochilish ekrani: JavaScript yuklanguncha logotip ko'rinadi (React uni almashtiradi) */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; font-family: Inter, system-ui, sans-serif; }
      .boot img { width: 112px; height: 112px; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot b { color: #c0272d; font-size: 22px; letter-spacing: -0.01em; }
      .boot span { color: #6b7185; font-size: 13px; margin-top: -12px; }
      @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
      @media (prefers-color-scheme: dark) { .boot { background: #0e1220; } .boot span { color: #949bb5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><img src="/logo.svg" alt="" /><b>Lola Edu</b><span>Türk Dili Markazi</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
