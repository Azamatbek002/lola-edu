<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161411" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Lola Edu Türk Dili Markazi — turk tilini o'rganishning eng go'zal yo'li. Kursga yozilish, dars jadvali, davomat va to'lovlar bitta ilovada." />
    <meta name="application-name" content="Lola Edu" />
    <!-- iPhone: bosh ekrandan to'liq ekran ilova sifatida ochilishi -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lola Edu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lola Edu — Türk Dili Markazi</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <!-- Havola ulashilganda (Telegram, Instagram, WhatsApp) chiqadigan ko'rinish -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lola Edu" />
    <meta property="og:title" content="Lola Edu — Türk Dili Markazi" />
    <meta property="og:description" content="Türkçe öğrenmenin en güzel yolu. Kursga yozilish, dars jadvali va to'lovlar bitta ilovada." />
    <meta property="og:url" content="https://lola-edu.vercel.app/" />
    <meta property="og:image" content="https://lola-edu.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lola Edu — Türk Dili Markazi" />
    <meta property="og:locale" content="uz_UZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lola-edu.vercel.app/og-image.png" />
    <style>
      /* Ochilish ekrani: JavaScript yuklanguncha logotip ko'rinadi (React uni almashtiradi) */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f6f3ee; font-family: Georgia, 'Times New Roman', serif; }
      .boot img { width: 96px; height: 96px; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot b { color: #1f1c18; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
      .boot span { color: #7d7568; font-size: 13px; margin-top: -12px; font-family: system-ui, sans-serif; }
      @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
      @media (prefers-color-scheme: dark) { .boot { background: #161411; } .boot b { color: #ede8e0; } .boot span { color: #9b9286; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><img src="/logo.svg" alt="" /><b>Lola Edu</b><span>Türk Dili Markazi</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
