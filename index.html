<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161411" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Lola Edu Türk Dili Markazi — turk tilini o'rganishning eng go'zal yo'li. Kursga yozilish, dars jadvali, davomat va to'lovlar bitta ilovada." />
    <meta name="application-name" content="Lola Edu" />
    <!-- iPhone: bosh ekrandan to'liq ekran ilova sifatida ochilishi -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lola Edu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Lola Edu — Türk Dili Markazi</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <!-- Havola ulashilganda (Telegram, Instagram, WhatsApp) chiqadigan ko'rinish -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lola Edu" />
    <meta property="og:title" content="Lola Edu — Türk Dili Markazi" />
    <meta property="og:description" content="Türkçe öğrenmenin en güzel yolu. Kursga yozilish, dars jadvali va to'lovlar bitta ilovada." />
    <meta property="og:url" content="https://lola-edu.vercel.app/" />
    <meta property="og:image" content="https://lola-edu.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lola Edu — Türk Dili Markazi" />
    <meta property="og:locale" content="uz_UZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lola-edu.vercel.app/og-image.png" />
    <script>
      // Tanlangan mavzu birinchi kadrdanoq qo'llanadi (oq-qora miltillash bo'lmaydi)
      try {
        var th = localStorage.getItem('lola:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = th
      } catch (e) {}
    </script>
    <style>
      /* Ochilish ekrani: ilova tayyor bo'lguncha logotip; so'ng yumshoq yo'qoladi (src/lib/boot.ts) */
      html { background: #f6f3ee; }
      html[data-theme='dark'] { background: #161411; }
      .boot { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f6f3ee; font-family: Georgia, 'Times New Roman', serif; transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.5s; }
      .boot img { width: 92px; height: 92px; animation: boot-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both, boot-breathe 2.4s ease-in-out 0.7s infinite; }
      .boot b { color: #1f1c18; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; animation: boot-in 0.7s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .boot span { color: #7d7568; font-size: 13px; margin-top: -12px; font-family: system-ui, sans-serif; animation: boot-in 0.7s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .boot.out { opacity: 0; visibility: hidden; }
      .boot.out img { transform: scale(1.06); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
      html[data-theme='dark'] .boot { background: #161411; }
      html[data-theme='dark'] .boot b { color: #ede8e0; }
      html[data-theme='dark'] .boot span { color: #9b9286; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
      @keyframes boot-breathe { 50% { transform: scale(0.96); } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" aria-hidden="true"><img src="/logo.svg" alt="" /><b>Lola Edu</b><span>Türk Dili Markazi</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
